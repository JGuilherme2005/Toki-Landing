<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111513">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Sylviae sign-in link handoff. This page is not indexed.">
  <title>Sylviae sign-in link</title>
  <link rel="icon" href="../../assets/icon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap"></noscript>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #111513;
      color: #efe9dc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --accent: #8fc27a;
      --muted: #a3a79b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(143, 194, 122, .14), transparent 58%),
        #111513;
    }

    main {
      width: min(100%, 440px);
      padding: clamp(28px, 8vw, 48px);
      border: 1px solid rgba(239, 233, 220, .12);
      border-radius: 24px;
      background: #171c19;
      box-shadow: 0 24px 72px rgba(0, 0, 0, .45);
      text-align: center;
    }

    .mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      margin: 0 auto 22px;
      overflow: hidden;
    }

    .mark img { width: 100%; height: 100%; object-fit: contain; }

    .brand {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2em;
    }

    /* Metric-matched fallback so the late Syne swap does not shift the heading. */
    @font-face {
      font-family: 'Syne Fallback';
      src: local('Arial Bold'), local('Arial-BoldMT'), local('Helvetica Bold'), local('Arimo Bold'), local('Liberation Sans Bold');
      font-weight: 700;
      size-adjust: 115%;
      ascent-override: 80%;
      descent-override: 24%;
      line-gap-override: 0%;
    }

    h1 {
      margin: 0;
      font-family: 'Syne', 'Syne Fallback', system-ui, sans-serif;
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.12;
      /* Reserve two lines: the JS-set result copy must not shift the card. */
      min-height: 2.24em;
    }

    .message { min-height: 6.4em; }
    .message, .hint {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .message { margin: 16px 0 0; }

    .open-app {
      display: inline-flex;
      min-height: 52px;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 13px 20px;
      border-radius: 14px;
      background: var(--accent);
      color: #0c0f0d;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .open-app:hover { background: #a3d28f; transform: translateY(-1px); }
    .open-app:focus-visible { outline: 3px solid #efe9dc; outline-offset: 4px; }
    .open-app[hidden] { display: none; }

    .hint { margin: 18px 0 0; font-size: 14px; min-height: 4.8em; }
    .home { display: inline-block; margin-top: 22px; color: var(--accent); font-size: 14px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="mark" aria-hidden="true"><img src="../../assets/icon-128.png" alt="" width="52" height="52"></div>
    <p class="brand">SYLVIAE</p>
    <h1 id="title">Checking your link…</h1>
    <p class="message" id="message">We’re checking your Sylviae link.</p>
    <a class="open-app" id="open-app" href="toki://auth-callback" hidden>Open Sylviae</a>
    <p class="hint" id="hint">If Sylviae isn’t available or the link doesn’t open it, return to the app and request a fresh link if needed.</p>
    <a class="home" href="../../">Back to Sylviae</a>
  </main>
  <script type="module" src="../../src/auth-callback.js"></script>
</body>
</html>
