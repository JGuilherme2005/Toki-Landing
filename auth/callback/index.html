<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17251d">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Sylviae sign-in link</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      background: #17251d;
      color: #fff8ea;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --accent: #f2e28a;
      --muted: #c4dac2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(82, 155, 114, .28), transparent 58%),
        #17251d;
    }

    main {
      width: min(100%, 440px);
      padding: clamp(28px, 8vw, 48px);
      border: 1px solid rgba(242, 226, 138, .24);
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(66, 130, 93, .82), rgba(39, 72, 52, .96));
      box-shadow: 0 24px 72px rgba(5, 15, 9, .34);
      text-align: center;
    }

    .mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 17px;
      background: var(--accent);
      color: #25392b;
      font-family: Georgia, serif;
      font-size: 31px;
      font-weight: 700;
      line-height: 1;
    }

    .brand {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.12;
    }

    .message, .hint {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .message { margin: 16px 0 0; }

    .open-app {
      display: inline-flex;
      min-height: 52px;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 13px 20px;
      border-radius: 14px;
      background: var(--accent);
      color: #1a241b;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .open-app:hover { background: #f6ea9c; transform: translateY(-1px); }
    .open-app:focus-visible { outline: 3px solid #fff8ea; outline-offset: 4px; }
    .open-app[hidden] { display: none; }

    .hint { margin: 18px 0 0; font-size: 14px; }
    .home { display: inline-block; margin-top: 22px; color: var(--accent); font-size: 14px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="mark" aria-hidden="true">s</div>
    <p class="brand">SYLVIAE</p>
    <h1 id="title">Checking your link…</h1>
    <p class="message" id="message">Sylviae is preparing the next step.</p>
    <a class="open-app" id="open-app" href="toki://auth-callback" hidden>Open Sylviae</a>
    <p class="hint" id="hint">If Sylviae isn’t available or the link doesn’t open it, return to the app and request a fresh link if needed.</p>
    <a class="home" href="../../">Back to Sylviae</a>
  </main>
  <script type="module" src="../../src/auth-callback.js"></script>
</body>
</html>
